<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VELOX Cycles</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--k:#09070f;--g:#2a1656;--r:#d6408f;--r2:#1a1038;--iv:#f5f0ff;--mut:#a79fc2;--ln:rgba(245,240,255,.12);--grad:linear-gradient(120deg,#6a3de8 0%,#a64bd6 30%,#d6408f 70%,#ffb703 100%);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--k);color:var(--iv);font-family:"Space Grotesk",system-ui,sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.5}
body::before{content:"";position:fixed;inset:-10%;background:radial-gradient(ellipse at 12% 8%,var(--g) 0,transparent 45%),radial-gradient(ellipse at 92% 32%,var(--r2) 0,transparent 50%),radial-gradient(ellipse at 50% 105%,#1a1038 0,transparent 60%);opacity:.9;animation:drift 18s ease-in-out infinite alternate;z-index:-1;pointer-events:none}
@keyframes drift{to{transform:translate(-3%,2%) scale(1.05)}}
a{color:inherit}
button,input,select{font:inherit}
button{cursor:pointer}
h1,h2,h3{letter-spacing:-.02em;line-height:1.05}
h1{font-size:clamp(44px,7vw,96px)} h2{font-size:clamp(30px,4vw,50px)}
.sub{color:var(--mut)}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#c8b6ff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;background:var(--grad);background-size:200% 100%;color:var(--iv);font-weight:600;border:1px solid var(--ln);transition:background-position .6s,transform .25s,box-shadow .3s;text-decoration:none}
.btn:hover{background-position:100% 0;transform:translateY(-2px);box-shadow:0 12px 30px -10px #d6408f}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.05);box-shadow:none}
.btn.full{width:100%}
.btn.sm{padding:10px 16px;font-size:14px}
.btn:disabled{opacity:.4;pointer-events:none}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;padding:0;font-size:13px}
.lnk:hover{color:var(--iv)}
input,select{background:rgba(255,255,255,.04);border:1px solid var(--ln);color:var(--iv);border-radius:12px;padding:12px 14px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:#6a3de8;box-shadow:0 0 0 3px rgba(106,61,232,.35)}
select option{background:#111}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--mut)}

/* intro */
#intro{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity .8s,visibility .8s;cursor:pointer}
#intro.off{opacity:0;visibility:hidden}
.ilogo{font-size:clamp(48px,10vw,120px);font-weight:700;background:linear-gradient(90deg,#6a3de8,#ffb703,#d6408f,#6a3de8);background-size:200%;-webkit-background-clip:text;color:transparent;animation:ilog 2.4s cubic-bezier(.2,.7,.2,1) both,shine 3s linear infinite}
.ilogo span{color:#ffb703;-webkit-text-fill-color:#ffb703}
@keyframes ilog{from{letter-spacing:.8em;opacity:0;filter:blur(12px)}to{letter-spacing:.3em;opacity:1;filter:none}}
@keyframes shine{to{background-position:200% 0}}
#intro{background:radial-gradient(circle at 50% 40%,#2a1656 0,#09070f 45%,#1a1038 100%)}
.ibg{position:absolute;inset:0;background:conic-gradient(from 0deg,#6a3de8,#d6408f,#09070f,#6a3de8);opacity:.3;filter:blur(80px);animation:spin 10s linear infinite}
.ibike{width:min(360px,70vw);overflow:visible;margin-bottom:10px}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.6,0,.2,1) forwards}
.d2{animation-delay:.25s}.d3{animation-delay:.5s}
@keyframes draw{to{stroke-dashoffset:0}}
.itag{margin-top:18px;letter-spacing:.35em;text-transform:uppercase;font-size:12px;color:var(--mut);opacity:0;animation:fade 1s 2s forwards}
.artw{position:relative;width:100%;height:100%;display:grid;place-items:center}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph{transform:scale(1.06)}
.thumb .ph{position:absolute}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(14px);background:rgba(5,5,5,.6);border-bottom:1px solid var(--ln)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px;max-width:1240px;margin:0 auto;padding:0 22px}
.logo{font-weight:700;font-size:21px;letter-spacing:.14em;background:linear-gradient(90deg,#c8b6ff,#ffb703);-webkit-background-clip:text;color:transparent;text-decoration:none}
#nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
#nav a{color:var(--mut);text-decoration:none;font-size:14px;padding:8px 11px;border-radius:99px;transition:color .2s,background .2s}
#nav a:hover,#nav a.on{color:var(--iv);background:rgba(255,255,255,.07)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#d6408f;color:#fff;font-size:11px;margin-left:4px}

main{max-width:1240px;margin:0 auto;padding:110px 22px 80px;min-height:100vh}
main.pg{animation:pgIn .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgIn{from{opacity:0;transform:translateY(24px);filter:blur(6px)}}
.reveal{opacity:0;transform:translateY(40px) scale(.97);filter:blur(10px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1),filter .9s}
.reveal.in{opacity:1;transform:none;filter:none}
.grid .reveal:nth-child(4n+2){transition-delay:.1s}.grid .reveal:nth-child(4n+3){transition-delay:.2s}.grid .reveal:nth-child(4n){transition-delay:.3s}

/* hero */
.hero{min-height:78vh;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1 b{display:block;transform:translateY(110%);animation:up 1s cubic-bezier(.2,.7,.2,1) forwards}
.hero h1 b:nth-child(2){animation-delay:.15s}.hero h1 b:nth-child(3){animation-delay:.3s}
@keyframes up{to{transform:none}}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#c8b6ff,#ffb703,#c8b6ff);background-size:200%;-webkit-background-clip:text;color:transparent;animation:shine 4s linear infinite}
.heroLead{margin:22px 0 30px;max-width:460px;opacity:0;animation:fade 1s .8s forwards}
@keyframes fade{to{opacity:1}}
.heroArt{position:relative;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}
.heroArt::before{content:"";position:absolute;inset:-10%;border-radius:50%;background:conic-gradient(#2a1656,#d6408f,#09070f,#2a1656);filter:blur(60px);opacity:.55;animation:spin 14s linear infinite;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.heroArt svg{width:100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.marq{overflow:hidden;border-block:1px solid var(--ln);padding:18px 0;margin-top:70px;white-space:nowrap}
.marq div{display:inline-block;animation:marq 32s linear infinite;color:var(--mut);font-size:clamp(20px,3vw,34px);font-weight:600}
.marq i{font-style:normal;margin:0 26px;color:#c8b6ff}
@keyframes marq{to{transform:translateX(-50%)}}

.sec{margin-top:110px}
.shead{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:16px;margin-bottom:30px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.cat{padding:28px;border-radius:22px;border:1px solid var(--ln);min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;background:linear-gradient(135deg,#2a1656,#09070f 65%);transition:transform .4s,box-shadow .4s;color:var(--iv);font:inherit;text-align:left}
.cat:nth-child(2){background:linear-gradient(135deg,#d6408f,#09070f 65%)}
.cat:nth-child(3){background:linear-gradient(135deg,#09070f,#6a3de8 120%)}
.cat:nth-child(4){background:linear-gradient(135deg,#1a1038,#d6408f 130%,#09070f)}
.cat:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 40px -18px #d6408f}
.cat b{font-size:24px}
.cat small{color:var(--mut)}
.news{padding:44px;border-radius:26px;border:1px solid var(--ln);background:linear-gradient(120deg,rgba(42,22,86,.5),rgba(9,7,15,.9) 50%,rgba(214,64,143,.35));display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
.news .row input{flex:1}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{position:relative;background:linear-gradient(160deg,rgba(42,22,86,.4),rgba(9,7,15,.92) 55%,rgba(26,16,56,.35));border:1px solid var(--ln);border-radius:22px;padding:18px;display:flex;flex-direction:column;transition:border-color .3s,box-shadow .4s}
.card:hover{border-color:rgba(239,231,214,.3);box-shadow:0 24px 50px -20px rgba(214,64,143,.35)}
.card::before{content:"";position:absolute;inset:-1px;border-radius:22px;padding:1px;background:linear-gradient(135deg,#6a3de8,transparent 40%,#d6408f 85%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .4s;pointer-events:none}
.card:hover::before{opacity:1}
.img{aspect-ratio:4/3;border-radius:16px;background:radial-gradient(circle at 50% 75%,rgba(255,255,255,.08),transparent 60%),#070707;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.img svg{width:84%;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card:hover .img svg{transform:scale(1.07) translateY(-4px)}
.card:hover .wh{animation:spin .8s linear infinite}
.wh{transform-box:fill-box;transform-origin:center}
.card h3{font-size:20px;margin-top:14px;cursor:pointer}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px}
.price{font-size:20px;font-weight:700}
.tag{position:absolute;top:14px;left:14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:rgba(0,0,0,.6);border:1px solid var(--ln);color:#c8b6ff}
.heart{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid var(--ln);color:var(--mut);font-size:18px;transition:transform .3s,color .3s}
.heart.on{color:#ffb703;transform:scale(1.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 16px;border-radius:99px;border:1px solid var(--ln);color:var(--mut);background:none;font-size:14px;transition:all .25s}
.chip:hover,.chip.on{color:var(--iv);border-color:#6a3de8;background:linear-gradient(120deg,rgba(42,22,86,.7),rgba(214,64,143,.5))}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 24px}
.tools input{max-width:300px}
.tools select{width:auto}

/* product */
.pd{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center}
.stage{position:relative;aspect-ratio:1;border-radius:30px;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,rgba(42,22,86,.7),transparent 60%),radial-gradient(circle at 70% 30%,rgba(214,64,143,.35),transparent 55%),#09070f;border:1px solid var(--ln);overflow:hidden}
.stage svg{width:82%;animation:float 6s ease-in-out infinite}
.sweep{position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%);transform:translateX(-100%);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.opt{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 20px}
.sz{min-width:52px;padding:10px;border-radius:12px;border:1px solid var(--ln);background:none;color:var(--iv)}
.sz.on{background:var(--grad);border-color:transparent}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;transition:transform .2s}
.sw.on{border-color:var(--iv);transform:scale(1.15)}
.stars{color:#e0b45a;letter-spacing:2px}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}
.spec div{padding:12px;border:1px solid var(--ln);border-radius:14px;font-size:13px;color:var(--mut)}
.spec b{display:block;color:var(--iv);font-size:15px}
.rv-item{border-top:1px solid var(--ln);padding:16px 0}

/* panels */
.panel{border:1px solid var(--ln);border-radius:22px;padding:22px;background:rgba(255,255,255,.02)}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;align-items:start}
.line{display:grid;grid-template-columns:100px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln)}
.thumb{background:#070707;border-radius:14px;display:grid;place-items:center;height:72px}
.thumb svg{width:92%}
.qtyb{display:inline-flex;border:1px solid var(--ln);border-radius:99px;overflow:hidden;align-items:center}
.qtyb button{background:none;border:0;color:var(--iv);width:38px;height:40px;font-size:18px}
.qtyb span{min-width:30px;text-align:center}
.sumrow{display:flex;justify-content:space-between;color:var(--mut);margin:8px 0}
.sumrow.tot{color:var(--iv);font-size:20px;font-weight:700;border-top:1px solid var(--ln);padding-top:12px;margin-top:12px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pay{display:flex;gap:10px;flex-wrap:wrap}
.pay label{flex:1;min-width:130px;border:1px solid var(--ln);border-radius:14px;padding:14px;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--mut)}
.pay label:has(input:checked){border-color:#6a3de8;color:var(--iv);background:rgba(42,22,86,.45)}
.pay input{width:auto}

/* orders */
.order{border:1px solid var(--ln);border-radius:22px;padding:22px;margin-bottom:18px;background:linear-gradient(140deg,rgba(42,22,86,.3),rgba(9,7,15,.8))}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 8px}
.steps div{height:6px;border-radius:9px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
.steps div.done::after{content:"";position:absolute;inset:0;background:var(--grad);animation:fill .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes fill{from{transform:translateX(-100%)}}
.steplbl{display:grid;grid-template-columns:repeat(4,1fr);font-size:12px;color:var(--mut);gap:6px}
.steplbl .on{color:#c8b6ff}

/* auth */
.auth{max-width:460px;margin:0 auto}
.tabs{display:flex;background:rgba(255,255,255,.04);border-radius:99px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;padding:10px;border-radius:99px;border:0;background:none;color:var(--mut)}
.tabs button.on{background:var(--grad);color:var(--iv)}
.gbtn{background:#fff;color:#1f1f1f;border-color:transparent}
.gbtn:hover{background:#f1f1f1;box-shadow:0 10px 30px -12px #fff5}
.or{text-align:center;color:var(--mut);font-size:13px;margin:18px 0;display:flex;align-items:center;gap:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--ln)}
.err{color:#ff8a7a;font-size:13px;min-height:18px;margin-top:10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;flex:none}
#gm{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:80;animation:fadeIn .3s both}
@keyframes fadeIn{from{opacity:0}}
#gm .box{width:min(400px,92vw);background:#0b0d0b;border:1px solid var(--ln);border-radius:22px;padding:24px;animation:pgIn .5s both}
.acc{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;cursor:pointer;border:1px solid transparent;margin-bottom:6px;background:none;color:var(--iv);width:100%;text-align:left}
.acc:hover{border-color:var(--ln);background:rgba(255,255,255,.03)}

.empty{text-align:center;padding:70px 20px}
.empty p{margin:12px 0 26px}
.stat{padding:18px;border:1px solid var(--ln);border-radius:16px}
.stat b{display:block;font-size:28px}

#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,160%);background:#140e26;border:1px solid #6a3de8;padding:12px 20px;border-radius:14px;z-index:90;transition:transform .5s cubic-bezier(.2,.7,.2,1);font-size:14px;max-width:90vw}
#toast.on{transform:translate(-50%,0)}
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:10px;padding:14px 18px 14px 16px;border-radius:999px;background:var(--grad);background-size:200% 100%;color:var(--iv);text-decoration:none;font-weight:600;box-shadow:0 14px 34px -10px rgba(214,64,143,.6),inset 0 0 0 1px rgba(255,255,255,.1);transition:background-position .6s,transform .3s,opacity .4s;animation:fabIn .9s cubic-bezier(.2,.7,.2,1) .6s both}
.fab:hover{background-position:100% 0;transform:translateY(-3px) scale(1.03)}
.fab svg{width:20px;height:20px;flex:none}
.fab .n{min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:rgba(9,7,15,.65);display:grid;place-items:center;font-size:12px}
.fab.bump{animation:fabBump .5s cubic-bezier(.2,.7,.2,1)}
.fab.hide{opacity:0;pointer-events:none;transform:translateY(20px) scale(.9)}
@keyframes fabIn{from{opacity:0;transform:translateY(30px) scale(.8)}}
@keyframes fabBump{30%{transform:scale(1.14)}}
@media (max-width:560px){.fab .t{display:none}.fab{padding:14px}}
footer{border-top:1px solid var(--ln);padding:34px 22px 44px;color:var(--mut);font-size:13px}
footer div{max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

@media (max-width:900px){
  .hero,.pd,.two,.news{grid-template-columns:1fr}
  .cats{grid-template-columns:1fr 1fr}
  #nav a.hide{display:none}
  .spec{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){ .form2{grid-template-columns:1fr} .line{grid-template-columns:70px 1fr} .line>b{grid-column:2} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="intro"><div class="ibg"></div><svg class="ibike" viewBox="0 0 200 130" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle class="dr" pathLength="1" cx="45" cy="95" r="31" stroke="#efe7d6" stroke-width="2.5"/><circle class="dr d2" pathLength="1" cx="155" cy="95" r="31" stroke="#efe7d6" stroke-width="2.5"/><path class="dr d3" pathLength="1" d="M45 95L100 95L80 45L45 95M80 45L125 45L100 95M125 45L155 95M125 45L134 30L148 32M70 38H90" stroke="#d6408f" stroke-width="4"/></svg><div class="ilogo">VELOX<span>.</span></div><div class="itag">Ride in the dark. Own the road.</div></div>

<header><div class="nav"><a class="logo" href="#home">VELOX</a><nav id="nav"></nav></div></header>
<main id="main"></main>
<footer><div><span>© 2026 VELOX Cycles · Demo storefront</span><span>Ride in the dark. Own the road.</span></div></footer>
<a class="fab" id="fab" href="#cart" aria-label="Open cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L21 7H6"/></svg><span class="t">Cart</span><span class="n">0</span></a>
<div id="toast"></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const COL = {forest:"#1f7a50", crimson:"#a1262f", jet:"#2b2b2b", ivory:"#e9e2d0", bottle:"#0c4a33", oxblood:"#5c0f17"};
const SZ = ["S","M","L","XL"];
const DESC = {Road:"Race-tuned geometry, featherlight frame, crisp shifting.", Mountain:"Confident grip, trail-ready brakes, long-ride comfort.", City:"Upright comfort, practical fittings, everyday reliability.", "E-Bike":"Smooth torque-sensor assist with a long-range battery.", Parts:"Genuine-quality replacement part, tested for daily riding."};
const GA = [["Priya Raman","priya.raman@gmail.com"],["Arjun Mehta","arjun.mehta@gmail.com"]];
const RAW = [
 ["Apex R9","Road",84999,"Bestseller",["crimson","ivory"]],
 ["Gravel Nomad","Road",57400,"Adventure",["forest","jet"]],
 ["Peloton Pro","Road",72500,"New",["ivory","oxblood"]],
 ["Velocity Sprint","Road",45999,"Value",["bottle","crimson"]],
 ["Tandem Duo","Road",139000,"Limited",["jet","forest"]],
 ["Trailblazer X","Mountain",62500,"New",["forest","ivory"]],
 ["Shadow Hardtail","Mountain",38999,"Value",["jet","crimson"]],
 ["Summit Enduro","Mountain",91500,"Bestseller",["oxblood","jet"]],
 ["Rocky Trail","Mountain",29999,"Popular",["bottle","ivory"]],

    ${S.mode==="up" ? `<div class="field"><label for="nm">Full name</label><input id="nm" autocomplete="name"></div>` : ""}
    <div class="field"><label for="un">Username</label><input id="un" autocomplete="username"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="${S.mode==="in"?"current-password":"new-password"}"></div>
    <button class="btn full" data-a="auth">${S.mode==="in"?"Sign in":"Create account"}</button>
    <div class="err" id="err"></div>
    <div class="or">or</div>
    <div id="gsi" style="display:flex;justify-content:center;min-height:44px"></div><button class="btn gbtn full" id="gfb" data-a="gmodal" style="display:none"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6C12.3 13.4 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7-10 7-17.5z"/><path fill="#FBBC05" d="M10.4 28.8c-.5-1.4-.8-2.9-.8-4.8s.3-3.4.8-4.8l-7.8-6C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.7-4.2-13.6-9.9l-7.8 6C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>
    <p class="sub" style="font-size:12px;text-align:center;margin-top:16px">Demo sign-in: accounts are stored in this browser only.</p>
  </div></div>`
};

/* ---------- rendering & routing ---------- */
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), {threshold:.1});
function observe(){ document.querySelectorAll(".reveal:not(.in)").forEach(el => io.observe(el)); }

function nav(){
  const fb = $("#fab");
  if (fb) { const q = cartQty(); fb.classList.toggle("hide", S.page === "cart"); fb.querySelector(".n").textContent = q; if (q > (S.lq || 0)) { fb.classList.remove("bump"); void fb.offsetWidth; fb.classList.add("bump"); } S.lq = q; }
  const links = [["home","Home"],["shop","Shop"],["wishlist","Wishlist",me().wish.length],["cart","Cart",cartQty()],["orders","Orders"]];
  $("#nav").innerHTML = links.map(([k,l,n]) => `<a class="${S.page===k?"on":""}${k==="orders"?" hide":""}" href="#${k}">${l}${n!==undefined?badge(n):""}</a>`).join("")
    + (signedIn() ? `<a class="${S.page==="account"?"on":""}" href="#account">${me().name.split(" ")[0]}</a>` : `<a class="${S.page==="signin"?"on":""}" href="#signin">Sign in</a>`);
}

function paint(){ $("#main").innerHTML = VIEWS[S.page](); if (S.page === "shop") grid(); observe(); nav(); initGoogle(); }

function go(p){ if (location.hash.slice(1) !== p) location.hash = p; else render(); }

function render(){
  let p = location.hash.slice(1) || "home";
  if (!VIEWS[p]) p = "home";
  if (["checkout","orders","account"].includes(p) && !signedIn()) { S.pending = p; return go("signin"); }
  if (p === "signin" && signedIn()) return go("account");
  S.page = p;
  const m = $("#main");
  m.className = ""; m.innerHTML = VIEWS[p](); void m.offsetWidth; m.className = "pg";
  if (p === "shop") grid();
  observe(); nav();
}
addEventListener("hashchange", () => { render(); initGoogle(); });

/* ---------- actions ---------- */
let tt;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2400); }

function addCart(id, c, s){
  const k = `${id}-${c}-${s}`, cart = me().cart, l = cart.find(x => x.k === k);
  if (l) l.q = Math.min(10, l.q + 1); else cart.push({k, id, c, s, q:1});
  save(); nav(); toast(`${byId(id).n} added to cart`);
}
function toggleWish(id){
  const w = me().wish, i = w.indexOf(id);
  if (i > -1) { w.splice(i,1); toast("Removed from wishlist"); } else { w.push(id); toast("Saved to wishlist ♥"); }
  save(); paint();
}
function login(u){
  const user = DB.users[u];
  DB.guest.cart.forEach(g => { const l = user.cart.find(x => x.k === g.k); if (l) l.q = Math.min(10, l.q + g.q); else user.cart.push(g); });
  DB.guest.wish.forEach(id => { if (!user.wish.includes(id)) user.wish.push(id); });
  DB.guest.cart = []; DB.guest.wish = [];
  DB.session = u; save();
  toast(`Welcome, ${user.name.split(" ")[0]}`);
  const target = S.pending || "account"; S.pending = null;
  go(target);
}
async function doAuth(){
  const u = $("#un").value.trim().toLowerCase(), p = $("#pw").value, err = $("#err");
  const setErr = m => { if (err) err.textContent = m; };
  if (S.mode === "up") {
    const nm = $("#nm").value.trim();
    if (nm.length < 2) return setErr("Enter your name");
    if (!/^[a-z0-9_]{3,20}$/.test(u)) return setErr("Username: 3–20 letters, numbers or underscores");
    if (p.length < 6) return setErr("Password must be at least 6 characters");
    if (DB.users[u]) return setErr("That username is taken");
    DB.users[u] = {u, name:nm, email:"", provider:"password", hash: await H(u + ":" + p), cart:[], wish:[], orders:[], pf:{news:true, ord:true}};
    return login(u);
  }
  const x = DB.users[u];
  if (!x) return setErr("No account with that username");
  if (x.provider === "google") return setErr("This account uses Google sign-in");
  if ((await H(u + ":" + p)) !== x.hash) return setErr("Incorrect password");
  login(u);
}
const GID = "686082766723-88lr77kn4fbk1lc4igqgf75ffmn8dm35.apps.googleusercontent.com";
let gTries = 0;
function initGoogle(){
  const el = $("#gsi"), fb = $("#gfb");
  if (!el || el.dataset.g) return;
  if (!(window.google && google.accounts && google.accounts.id)) {
    if (++gTries < 12) return setTimeout(initGoogle, 400);
    if (fb) fb.style.display = "flex";
    return;
  }
  el.dataset.g = "1";
  google.accounts.id.initialize({ client_id: GID, callback: onG, ux_mode: "popup" });
  google.accounts.id.renderButton(el, { theme: "filled_black", size: "large", shape: "pill", text: "continue_with", width: 340 });
  if (fb) fb.style.display = "none";
}
function onG(r){
  let p = {};
  try {
    const b = r.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    p = JSON.parse(decodeURIComponent(atob(b).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join("")));
  } catch (e) { return toast("Google sign-in failed"); }
  const email = (p.email || "").toLowerCase();
  if (!email) return toast("Google sign-in failed");
  if (!DB.users[email]) DB.users[email] = {u:email, name:p.name || email.split("@")[0], email, provider:"google", cart:[], wish:[], orders:[], pf:{news:true, ord:true}};
  login(email);
}
function openG(){
  const d = document.createElement("div"); d.id = "gm";
  d.innerHTML = `<div class="box">
    <div class="row" style="justify-content:space-between"><b style="font-size:18px">Sign in with Google</b><button class="lnk" data-a="gclose">Close</button></div>
    <p class="sub" style="font-size:13px;margin:6px 0 14px">Choose an account to continue to VELOX</p>
    ${GA.map(([n,e]) => `<button class="acc" data-a="gpick" data-v="${e}" data-n="${n}"><span class="av">${n[0]}</span><span><b>${n}</b><span class="sub" style="display:block;font-size:13px">${e}</span></span></button>`).join("")}
    <div class="field" style="margin-top:12px"><label for="ge">Use another Google account</label><input id="ge" type="email" placeholder="you@gmail.com"></div>
    <button class="btn full" data-a="gpick" data-v="other">Continue</button></div>`;
  d.addEventListener("click", e => { if (e.target === d) d.remove(); });
  document.body.appendChild(d);
}
function gpick(el){
  let email = el.dataset.v, name = el.dataset.n;
  if (email === "other") {
    email = ($("#ge").value || "").trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(email)) return toast("Enter a valid email address");
    name = email.split("@")[0].replace(/[._]/g," ").replace(/\b\w/g, c => c.toUpperCase());
  }
  if (!DB.users[email]) DB.users[email] = {u:email, name, email, provider:"google", cart:[], wish:[], orders:[], pf:{news:true, ord:true}};
  $("#gm")?.remove();
  login(email);
}
function placeOrder(){
  const n = $("#ck_n").value.trim(), l = $("#ck_l").value.trim(), c = $("#ck_c").value.trim(), pn = $("#ck_p").value.trim();
  if (!n || !l || !c || !/^\d{6}$/.test(pn)) return toast("Please complete the address with a 6-digit PIN");
  const cart = me().cart, {tot} = totals(cart);
  const pay = document.querySelector('input[name=pay]:checked').value;
  me().orders.unshift({
    id: "VX" + Date.now().toString(36).toUpperCase().slice(-6), at: Date.now(),
    items: cart.map(it => { const p = byId(it.id); return {n:p.n, q:it.q, s:it.s, p:p.p}; }),
    tot, pay, addr: `${n}, ${l}, ${c} ${pn}`, cx: false
  });
  me().cart = []; S.coupon = 0; save(); nav();
  toast("Order placed ✓");
  go("orders");
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, id = +el.dataset.id, v = el.dataset.v;
  switch (a) {
    case "open": S.sel = id; S.ps = "M"; go("product"); break;
    case "fav": toggleWish(id); break;
    case "add": addCart(id, S.pc[id] || 0, el.dataset.s || "M"); break;
    case "col": S.pc[id] = +v; paint(); break;
    case "sz": S.ps = v; paint(); break;
    case "ft": S.f.t = v; S.f.s = "All"; paint(); break;
    case "fs": S.f.s = v; paint(); break;
    case "cat": S.f = {q:"", t:v, pr:"all", so:"feat"}; go("shop"); break;
    case "q": { const l = me().cart.find(x => x.k === el.dataset.k); if (l) l.q = Math.max(1, Math.min(10, l.q + +el.dataset.d)); save(); paint(); break; }
    case "rm": me().cart = me().cart.filter(x => x.k !== el.dataset.k); save(); paint(); break;
    case "clear": me().cart = []; save(); paint(); toast("Cart cleared"); break;
    case "cp": { const code = ($("#cp").value || "").trim().toUpperCase(); if (code === "VELOX10") { S.coupon = 1; toast("Coupon applied: 10% off"); } else toast("That coupon isn't valid"); paint(); break; }
    case "checkout": go("checkout"); break;
    case "place": placeOrder(); break;
    case "cancel": { const o = me().orders.find(x => x.id === el.dataset.id); if (o) { o.cx = true; save(); toast("Order cancelled"); paint(); } break; }
    case "sub": { const em = ($("#em").value || "").trim(); toast(/^\S+@\S+\.\S+$/.test(em) ? "You're on the list. Welcome to VELOX." : "Enter a valid email"); break; }
    case "tab": S.mode = v; paint(); break;
    case "auth": doAuth(); break;
    case "gmodal": openG(); break;
    case "gclose": $("#gm")?.remove(); break;
    case "gpick": gpick(el); break;
    case "logout": DB.session = null; save(); toast("Signed out"); go("home"); break;
    case "pref": { const u = me(); u.pf = u.pf || {}; u.pf[v] = !u.pf[v]; save(); paint(); break; }
  }
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.f.q = e.target.value; grid(); } });
document.addEventListener("change", e => {
  if (e.target.id === "pr") { S.f.pr = e.target.value; grid(); }
  if (e.target.id === "so") { S.f.so = e.target.value; grid(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && ["un","pw","nm"].includes(e.target.id)) doAuth();
  if (e.key === "Escape") $("#gm")?.remove();
});

/* live order progress (updates only the bars that change) */
setInterval(() => {
  if (S.page !== "orders") return;
  document.querySelectorAll(".steps-box").forEach(el => {
    const o = me().orders.find(x => x.id === el.dataset.oid); if (!o) return;
    const st = String(stage(o));
    if (el.dataset.st !== st) { el.dataset.st = st; el.innerHTML = stepsHTML(o); }
  });
}, 2000);

/* intro */
const intro = $("#intro");
const dismiss = () => intro.classList.add("off");
intro.addEventListener("click", dismiss);
setTimeout(dismiss, 3400);

render();
initGoogle();
})();
</script>
</body>
</html>
